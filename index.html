<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial- scale=1.0">
    <title>errate die Zahl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Errate die Zahl</h1></header>
    <div class="container">
        <h5>Dieses Programm wurde mit hilfe eines Tutorials erstellt!</h5>
        <h2 id="status_display">Um die Zahl zu erraten, gib bitte eine Zahl zwischen 0 und 100 in das Textfeld ein!</h2>
        <h3 id="tries_display"> Versuche: 0</h3>
        <form onsubmit="guess_number(); return false;">
            <input id="guess" type="number" required placeholder="Zahl eingeben">
            <button>Abschicken</button>
        </form>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>

</body>
</html>
